<!DOCTYPE html>
<html>
<head>
    <title>Employee Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        table {
            border-collapse: collapse;
            width: 60%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #555;
            color: white;
        }
    </style>
</head>
<body>

<h2>Employee List</h2>

<table id="employeeTable">
    <thead>
        <tr><th>ID</th><th>Name</th><th>Department</th><th>Salary</th></tr>
    </thead>
    <tbody>
        <!-- Data will be inserted here -->
    </tbody>
</table>

<script>
    // Sample employee data (simulate fetching from database)
    const employees = [
        {id: 1, name: "Kushi", department: "Engineering", salary: 75000},
        {id: 2, name: "Arjun", department: "Marketing", salary: 60000},
        {id: 3, name: "Sara", department: "HR", salary: 65000}
    ];

    // Insert data into table
    const tbody = document.getElementById("employeeTable").getElementsByTagName("tbody")[0];

    employees.forEach(emp => {
        let row = tbody.insertRow();
        row.insertCell().textContent = emp.id;
        row.insertCell().textContent = emp.name;
        row.insertCell().textContent = emp.department;
        row.insertCell().textContent = emp.salary;
    });
</script>

</body>
</html>
